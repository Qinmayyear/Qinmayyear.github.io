<svg xmlns="http://www.w3.org/2000/svg" width="920" height="486" viewBox="0 0 920 486" role="img" aria-labelledby="title description">
  <title id="title">Solar Rankine cycle with battery storage</title>
  <desc id="description">Solar heat drives an organic Rankine cycle, which produces electricity for a building. Excess electricity charges a battery for later use.</desc>
