      <path d="m0 0 10 5-10 5z" fill="#a96335"/>
    </marker>
    <marker id="power-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="m0 0 10 5-10 5z" fill="#536358"/>
    </marker>
  </defs>
  <rect width="920" height="486" fill="#faf7ee"/>
  <g fill="none" stroke="#d2c1a8" stroke-width="2">
    <path d="M42 76h836M42 443h836"/>
  </g>
