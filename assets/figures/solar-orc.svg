    <text x="617" y="185" fill="#49584e">Power</text>
    <text x="618" y="346" fill="#49584e" text-anchor="start">Later use</text>
  </g>
  <g stroke="#b7a489" stroke-width="2">
    <rect x="44" y="126" width="208" height="140" rx="4" fill="#f4e7cc"/>
    <rect x="357" y="126" width="208" height="140" rx="4" fill="#f4e7cc"/>
    <rect x="669" y="126" width="208" height="140" rx="4" fill="#f4e7cc"/>
    <rect x="357" y="314" width="208" height="102" rx="4" fill="#e9ebdc"/>
